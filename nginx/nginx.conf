user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Phase 2: large dataset files no longer route through Nginx/the
    # backend at all — Phase 1's presigned multipart upload PUTs bytes
    # directly from the browser to MinIO. This cap now only bounds the
    # small-file fallback path (files under the multipart threshold,
    # frontend's MULTIPART_THRESHOLD_BYTES) and every other proxied
    # request body (JSON API calls, etc.) — kept comfortably above the
    # existing MAX_UPLOAD_SIZE_MB default for headroom, but no longer
    # needs to cover a 50GB-TB file itself.
    client_max_body_size 5100m; # must stay >= MAX_UPLOAD_SIZE_MB in backend config

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Applies across all server blocks in conf.d/. Auth endpoints get a
    # tighter zone defined at the location level (see bodp.conf).
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    include /etc/nginx/conf.d/*.conf;
}
