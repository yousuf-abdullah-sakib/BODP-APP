# Replace bodp.example.org with the real domain during Phase 1 VPS setup.
# Certbot's webroot challenge must be reachable over plain HTTP before the
# first certificate is issued — see the VPS provisioning checklist.

server {
    listen 80;
    server_name bodp.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bodp.example.org;

    ssl_certificate     /etc/letsencrypt/live/bodp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bodp.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Phase 10.1 (hardening plan): 'unsafe-inline' on script-src/style-src
    # is a deliberate, documented trade-off, not an oversight — Next.js's
    # built-in hydration/style injection and Plotly's canvas/WebGL render
    # path (which injects inline style tags for chart layout) are not
    # nonce-compatible without per-request nonce plumbing through a
    # middleware.ts, which doesn't exist in this app today. img-src must
    # include the object-storage public endpoint since avatars/media are
    # rendered as plain <img> tags resolved via NEXT_PUBLIC_STORAGE_
    # PUBLIC_URL (frontend/src/lib/avatar.ts) — replace
    # storage.bodp.example.org below with that same env var's real domain
    # when deploying (see docs/SECURITY_AUDIT.md for the full policy
    # rationale). No report-collection endpoint exists, so this ships
    # enforcing rather than report-only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.bodp.example.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Backend API ---
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Phase 2: coordinated with Gunicorn's --timeout (backend/Dockerfile /
        # docker-compose.prod.yml) so neither layer cuts a request the other
        # is still willing to wait on. Nginx's compiled-in default is 60s,
        # which the small-file upload fallback path (<20MB) and any
        # slow-but-legitimate request could plausibly exceed on a
        # constrained connection — raised generously since a background
        # admin-panel upload has no interactive user watching a spinner for
        # exactly this duration. proxy_request_buffering off avoids Nginx
        # writing a second full copy of the request body to disk before
        # forwarding it, relevant for the small-file fallback path.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Tighter rate limit specifically on auth endpoints (register/login/etc).
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (Next.js) — enabled once the frontend service exists ---
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # MinIO console and API ports (9000/9001) are intentionally NOT proxied
    # here — they stay unreachable from outside the Docker network, per
    # Master Plan §0 / architecture doc network isolation requirement.
}
