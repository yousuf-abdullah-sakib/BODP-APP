# Replace bodp.example.org with the real domain during Phase 1 VPS setup.
# Certbot's webroot challenge must be reachable over plain HTTP before the
# first certificate is issued — see the VPS provisioning checklist.

server {
    listen 80;
    server_name bodp.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bodp.example.org;

    ssl_certificate     /etc/letsencrypt/live/bodp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bodp.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Phase 10.1 (hardening plan): 'unsafe-inline' on script-src/style-src
    # is a deliberate, documented trade-off, not an oversight — Next.js's
    # built-in hydration/style injection and Plotly's canvas/WebGL render
    # path (which injects inline style tags for chart layout) are not
    # nonce-compatible without per-request nonce plumbing through a
    # middleware.ts, which doesn't exist in this app today. Object storage
    # (avatars/media, rendered as plain <img> tags) is served from this
    # same origin via the /storage/ location below, so no separate img-src
    # allowance is needed — 'self' already covers it. No report-collection
    # endpoint exists, so this ships enforcing rather than report-only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Backend API ---
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Phase 2: coordinated with Gunicorn's --timeout (backend/Dockerfile /
        # docker-compose.prod.yml) so neither layer cuts a request the other
        # is still willing to wait on. Nginx's compiled-in default is 60s,
        # which the small-file upload fallback path (<20MB) and any
        # slow-but-legitimate request could plausibly exceed on a
        # constrained connection — raised generously since a background
        # admin-panel upload has no interactive user watching a spinner for
        # exactly this duration. proxy_request_buffering off avoids Nginx
        # writing a second full copy of the request body to disk before
        # forwarding it, relevant for the small-file fallback path.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Tighter rate limit specifically on auth endpoints (register/login/etc).
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Object storage (MinIO S3 API) ---
    # Presigned GET/PUT URLs are followed directly by a browser, never
    # routed through the backend — STORAGE_VPS_PUBLIC_ENDPOINT_URL is set
    # to https://<domain>/storage so boto3 signs URLs against this exact
    # path prefix (path-style addressing: /storage/<bucket>/<key>?sig=...).
    # The trailing slashes on both `location` and `proxy_pass` below are
    # load-bearing — together they strip the /storage/ prefix before
    # forwarding to MinIO, which only knows its own /<bucket>/<key> paths.
    # Only the S3 API port (9000) is exposed this way; the MinIO web
    # console (9001) stays unreachable from outside the Docker network.
    location /storage/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads (presigned PUT, used by direct-to-storage multipart
        # upload) can be large — match the same generous timeout/no-
        # buffering treatment the API location already uses.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # --- Frontend (Next.js) ---
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # MinIO's web console (9001) is intentionally NOT proxied here — it
    # stays unreachable from outside the Docker network, per Master Plan
    # §0 / architecture doc network isolation requirement. Only the S3
    # API (9000) is exposed, and only via the /storage/ prefix above.
}
