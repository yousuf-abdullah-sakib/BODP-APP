[project]
name = "bodp-backend"
version = "0.1.0"
description = "Bangladesh Ocean/Environmental Data Platform - backend API"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "geoalchemy2>=0.15.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "python-dateutil>=2.9.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "xarray>=2024.10.0",
    "netCDF4>=1.7.2",
    "h5netcdf>=1.4.0",
    "scipy>=1.14.1",
    "h5py>=3.12.1",
    "rasterio>=1.4.3",
    "python-magic-bin>=0.4.14; platform_system=='Windows'",
    "python-magic>=0.4.27; platform_system!='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
